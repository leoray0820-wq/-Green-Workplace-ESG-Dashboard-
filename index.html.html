    function calculateRecipePreview() {
      const types = ['kitchen', 'cooked_food', 'sawdust', 'leaves', 'biochar', 'ash'];
      let totalKg = 0;
      let totalC = 0;
      let totalN = 0;

      types.forEach(t => {
        const chk = document.getElementById(`recipe-chk-${t}`);
        const num = document.getElementById(`recipe-num-${t}`);
        if (chk && chk.checked) {
          let kg = parseFloat(num.value) || 0;
          totalKg += kg;
          totalC += kg * FEEDSTOCK_SPECS[t].cRatio;
          totalN += kg * FEEDSTOCK_SPECS[t].nRatio;
        }
      });

      document.getElementById('recipe-preview-mass').innerText = `${totalKg.toFixed(1)} kg`;
      let cn = totalN > 0 ? (totalC / totalN) : 0;
      document.getElementById('recipe-preview-cn').innerText = `${cn.toFixed(1)}:1`;
    }

    function applyRecipeBatch(isAuto = false) {
      const types = ['kitchen', 'cooked_food', 'sawdust', 'leaves', 'biochar', 'ash'];
      let totalKg = 0;

      types.forEach(t => {
        const chk = document.getElementById(`recipe-chk-${t}`);
        const num = document.getElementById(`recipe-num-${t}`);
        if (chk && chk.checked) {
          let kg = parseFloat(num.value) || 0;
          if (kg > 0) {
            applySingleFeedstock(t, kg);
            totalKg += kg;
          }
        }
      });

      if (totalKg > 0) {
        if (isAuto) showToast(`🤖 AI 智控系統已自動投放自訂配方 (${totalKg.toFixed(1)} kg)`);
        else showToast(`已成功一鍵投入自訂配方 (${totalKg.toFixed(1)} kg)`);
      } else {
        if (!isAuto) showToast('❌ 請至少勾選一項資材並輸入公斤數！');
      }
    }

    /* =========================================================================

    function updateUI() {
      const c = state.compost;
      
      let currentDays = Math.floor(state.totalHours / 24) + 1;
      document.getElementById('hud-days').innerText = `第 ${currentDays} 天`;
      document.getElementById('hud-weather').innerText = `${state.weather.name} (${state.weather.ambientTemp}°C)`;

      document.getElementById('hud-coins').innerText = `NT$ ${state.coins.toLocaleString()}`;

      let minBeddingKg = getMinRequiredBeddingMass();
      let sellableVermiKg = getAvailableSellableVermiStock();

      document.getElementById('hud-vermicompost').innerText = `${sellableVermiKg.toFixed(1)} Kg`;

      let tempEff = (c.temp >= 15 && c.temp <= 28) ? 1.0 : (c.temp >= 10 && c.temp <= 34) ? 0.6 : 0.15;
      let moistEff = (c.moisture >= 60 && c.moisture <= 80) ? 1.0 : (c.moisture >= 50 && c.moisture <= 85) ? 0.6 : 0.2;
      let phEff = (c.ph >= 6.5 && c.ph <= 8.0) ? 1.0 : 0.3;
      let oxyEff = (c.oxygen >= 15.0) ? 1.0 : (c.oxygen >= 10.0) ? 0.6 : 0.2;
      let ecEff = (c.ec <= 3.5) ? 1.0 : 0.4;
      let currentEffPercent = Math.round((tempEff * moistEff * phEff * oxyEff * ecEff) * 100);
      document.getElementById('val-efficiency').innerText = `${currentEffPercent}%`;

      document.getElementById('val-temp').innerText = `${c.temp.toFixed(1)}°C`;
      document.getElementById('val-moist').innerText = `${c.moisture.toFixed(1)}%`;
      document.getElementById('val-ph').innerText = c.ph.toFixed(2);
      document.getElementById('val-cn').innerText = `${c.cnRatio.toFixed(1)}:1`;
      document.getElementById('val-ec').innerText = `${c.ec.toFixed(2)} mS/cm`;
      document.getElementById('val-oxy').innerText = `${c.oxygen.toFixed(1)}%`;
      document.getElementById('val-odor').innerText = `${Math.floor(c.odorPpm)} PPM`;

      let unProcessedNewWasteMass = state.feedstockPool.reduce((sum, item) => sum + item.massKg, 0);
      let totalUnProcessedCompostMass = state.matureCompostKg + unProcessedNewWasteMass;
      let totalBeddingMatrixMass = totalUnProcessedCompostMass + state.vermicompostKg;
      
      let organicLoadRatio = totalBeddingMatrixMass > 0 ? (unProcessedNewWasteMass / totalBeddingMatrixMass) * 100 : 0;
      document.getElementById('val-load-ratio').innerText = `${organicLoadRatio.toFixed(1)}%`;

      const olrBadge = document.getElementById('olr-badge');
      if (organicLoadRatio >= 50.0) {
        olrBadge.innerText = '紅色警報: 發酵積熱風險!';
        olrBadge.className = 'text-[9px] px-2 py-0.5 rounded font-bold bg-rose-950 text-rose-300 border border-rose-700/50 animate-pulse';
      } else if (organicLoadRatio >= 35.0) {
        olrBadge.innerText = '黃色警戒: 負荷偏高';
        olrBadge.className = 'text-[9px] px-2 py-0.5 rounded font-bold bg-amber-950 text-amber-300 border border-amber-700/50';
      } else {
        olrBadge.innerText = '負荷正常';
        olrBadge.className = 'text-[9px] px-2 py-0.5 rounded font-bold bg-emerald-950 text-emerald-400 border border-emerald-700/50';
      }

      document.getElementById('val-area').innerText = `${c.areaM2.toFixed(1)} m²`;
      document.getElementById('val-worm-pop').innerText = c.wormPop.toLocaleString();
      document.getElementById('val-bed-total-mass').innerText = totalBeddingMatrixMass.toFixed(1);

      let biomass = c.wormPop * 0.0005;
      let maxCapKg = c.areaM2 * 4.0;
      document.getElementById('val-biomass').innerText = biomass.toFixed(2);
      document.getElementById('val-worm-cap').innerText = maxCapKg.toFixed(2);
      document.getElementById('val-starve-days').innerText = (c.starveHours / 24.0).toFixed(1);
      
      let dailyMaxFeed = biomass * 0.8 * (currentEffPercent / 100);
      document.getElementById('val-suggested-max').innerText = dailyMaxFeed.toFixed(2);

      // 庫存與產出顯示（包含最低保護床土與淨可售庫存）
      document.getElementById('val-total-waste-mass').innerText = `${unProcessedNewWasteMass.toFixed(2)} Kg`;
      document.getElementById('val-total-processed').innerText = `${state.totalProcessedWasteKg.toFixed(2)} Kg`;
      
      document.getElementById('val-total-vermi-produced').innerText = `${state.totalVermicompostProducedKg.toFixed(2)} Kg`;
      document.getElementById('val-min-bedding').innerText = `${minBeddingKg.toFixed(2)} Kg`;
      document.getElementById('val-vermi-stock').innerText = `${sellableVermiKg.toFixed(2)} Kg`;

      let avoidedCo2Ton = (state.totalProcessedWasteKg * 0.485) / 1000.0;
      let totalCo2eTon = avoidedCo2Ton + state.carbonSeqTon;
      
      document.getElementById('hud-carbon-co2e').innerText = `${totalCo2eTon.toFixed(3)} t`;
      document.getElementById('val-carbon-avoided').innerText = `${avoidedCo2Ton.toFixed(3)} t`;
      document.getElementById('val-carbon-sequestered').innerText = `${state.carbonSeqTon.toFixed(3)} t`;
    }

    window.onload = function() {
      calculateRecipePreview();
      setInterval(tickSimulation, 1000);
      updateUI();
    };
  </script>
</body>
</html>
