<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歸蚓酷客：永續大地冒險 v3.2 強制修復版</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #090d16; }
        .font-pixel { font-family: 'VT323', monospace; }
        .text-glow { text-shadow: 0 0 10px rgba(16, 185, 129, 0.6); }
        .log-scrollbar::-webkit-scrollbar { width: 6px; }
        .log-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
        .log-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col justify-between selection:bg-emerald-500 selection:text-slate-900">

    <header class="bg-slate-900/95 border-b border-emerald-900/50 sticky top-0 z-50 backdrop-blur">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-900/80 border border-emerald-500/50 flex items-center justify-center text-2xl shadow-lg">🪱</div>
                <div>
                    <h1 class="font-extrabold text-lg sm:text-xl text-emerald-400 text-glow flex items-center gap-2">
                        歸蚓酷客：永續大地冒險 <span class="text-xs bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded border border-emerald-500/40">v3.2</span>
                    </h1>
                    <p class="text-[10px] sm:text-xs text-slate-400">Terra Chef: Low-Carbon Eco Farm RPG</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <button onclick="saveGame(true)" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs text-slate-300 px-3 py-1.5 rounded-lg transition">💾 儲存</button>
                <button onclick="hardResetGame()" class="bg-rose-950/80 hover:bg-rose-900 border border-rose-800 text-xs text-rose-200 px-3 py-1.5 rounded-lg transition font-bold">🔄 強制重置</button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6 w-full flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Left Dashboard -->
        <div class="lg:col-span-4 space-y-4">
            <div class="bg-slate-900 rounded-2xl p-3 border border-emerald-500/30 shadow-2xl flex flex-col items-center">
                <div class="w-full flex justify-between items-center mb-2 px-1">
                    <span class="text-xs font-bold text-emerald-400">🎮 農場即時像素視窗</span>
                    <span id="weather-badge" class="text-[10px] bg-slate-800 text-sky-300 px-2 py-0.5 rounded-full border border-slate-700">☀️ 晴朗微風</span>
                </div>
                <canvas id="farmCanvas" width="320" height="160" class="rounded-xl border border-slate-800 bg-slate-950 w-full shadow-inner"></canvas>
            </div>

            <div class="bg-slate-800/90 rounded-2xl p-4 border border-slate-700 space-y-3 shadow-xl">
                <div class="flex justify-between items-center pb-2 border-b border-slate-700/80">
                    <div>
                        <span id="chapter-badge" class="bg-emerald-950 text-emerald-300 border border-emerald-500/40 text-[10px] font-black px-2.5 py-0.5 rounded-full uppercase">第 0 章</span>
                        <h2 id="farm-name" class="font-bold text-slate-100 text-sm mt-1">峨眉低碳示範農場</h2>
                    </div>
                    <div class="text-right">
                        <span class="text-3xl font-black text-amber-400 font-pixel" id="stat-day">Day 1</span>
                    </div>
                </div>

                <div>
                    <div class="flex justify-between text-xs mb-1">
                        <span class="text-slate-300 font-medium">🪱 蚯蚓活力</span>
                        <span id="stat-worm-text" class="font-bold text-emerald-400">80%</span>
                    </div>
                    <div class="w-full bg-slate-900 rounded-full h-3 overflow-hidden p-0.5 border border-slate-700">
                        <div id="stat-worm-bar" class="bg-emerald-500 h-full rounded-full transition-all duration-500" style="width: 80%"></div>
                    </div>
                </div>

                <div>
                    <div class="flex justify-between text-xs mb-1">
                        <span class="text-slate-300 font-medium">💧 堆肥濕度</span>
                        <span id="stat-moisture-text" class="font-bold text-sky-400">70%</span>
                    </div>
                    <div class="w-full bg-slate-900 rounded-full h-3 overflow-hidden p-0.5 border border-slate-700">
                        <div id="stat-moisture-bar" class="bg-sky-500 h-full rounded-full transition-all duration-500" style="width: 70%"></div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2 pt-1">
                    <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-700/60">
                        <p class="text-[10px] text-slate-400">減碳點數</p>
                        <p class="text-base font-black text-emerald-400" id="stat-carbon">0.0 <span class="text-[10px] font-normal text-slate-400">kg</span></p>
                    </div>
                    <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-700/60">
                        <p class="text-[10px] text-slate-400">土壤碳匯 (SOC)</p>
                        <p class="text-base font-black text-amber-400" id="stat-soc">10 <span class="text-[10px] font-normal text-slate-400">pt</span></p>
                    </div>
                </div>
            </div>

            <div class="bg-slate-800/80 rounded-2xl p-4 border border-slate-700/80 space-y-2">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">📦 有機資材庫存</h3>
                <div id="materials-list" class="grid grid-cols-2 gap-2"></div>
            </div>
        </div>

        <!-- Right Story & Action Deck -->
        <div class="lg:col-span-8 flex flex-col space-y-4">
            <div id="view-story" class="bg-slate-800/90 rounded-2xl border border-emerald-500/30 p-5 shadow-2xl flex-1 flex flex-col justify-between space-y-4 min-h-[380px]">
                <div id="npc-header" class="flex items-center space-x-3 pb-3 border-b border-slate-700/60">
                    <div id="npc-avatar" class="w-12 h-12 rounded-2xl bg-emerald-950 border border-emerald-500/40 text-2xl flex items-center justify-center">👨‍🌾</div>
                    <div>
                        <h4 id="npc-name" class="font-bold text-slate-100 text-sm">林業主 (峨眉農夫)</h4>
                        <p id="npc-role" class="text-[11px] text-emerald-400 font-medium">土地合作夥伴</p>
                    </div>
                </div>

                <div class="space-y-3 flex-1 overflow-y-auto max-h-[220px] log-scrollbar pr-2">
                    <h3 id="chapter-title" class="text-xs font-bold text-amber-400">第 0 章：起源 - 峨眉之約</h3>
                    <p class="text-sm text-slate-200 leading-relaxed font-medium" id="story-text">載入劇情中...</p>
                </div>

                <div id="choices-container" class="space-y-2 pt-2 border-t border-slate-700/60"></div>
            </div>

            <div class="bg-slate-900/90 rounded-2xl border border-slate-800 p-4 shadow-inner space-y-2">
                <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider">💻 系統日誌 Console Log</h4>
                <div id="game-log" class="text-xs text-slate-400 space-y-1.5 max-h-28 overflow-y-auto log-scrollbar font-mono leading-relaxed"></div>
            </div>
        </div>

    </main>

    <script>
        const SCENARIOS = {
            "CH0_START": {
                chapter: 0,
                chapterTitle: "第 0 章：起源 - 峨眉之約",
                npcName: "林業主 (峨眉農夫)",
                npcRole: "土地合作夥伴",
                avatar: "👨‍🌾",
                text: "「阿酷，這片在新竹峨眉的荒廢果園就交給你實踐低碳夢想了！現在這裡滿地都是枯枝落葉，社區每天還有好多咖啡渣跟茶葉渣被扔掉。你打算怎麼開始？」",
                choices: [
                    {
                        text: "🪱 架設「蚯蚓堆肥箱 V1.0」，引入太平二號蚯蚓軍團",
                        nextScenario: "CH0_BIN_SETUP",
                        action: () => {
                            addLog("建置了第一座『蚯蚓堆肥箱 V1.0』！");
                            gameState.carbonOffset += 2.5;
                        }
                    },
                    {
                        text: "🍃 整理現場枯枝落葉，堆置預備作為高碳骨材",
                        nextScenario: "DAILY_ROUTINE",
                        action: () => {
                            addLog("整理現場枯枝落葉，打下乾碳源基礎。");
                            gameState.unprocessedWaste.dryLeaves += 5.0;
                        }
                    }
                ]
            },
            "CH0_BIN_SETUP": {
                chapter: 0,
                chapterTitle: "第 0 章：啟動蚯蚓分解引擎",
                npcName: "阿酷",
                npcRole: "歸蚓酷客創辦人",
                avatar: "🧑‍🌾",
                text: "蚯蚓箱 V1.0 搭建完成！收到社區咖啡館贊助的咖啡渣與茶葉渣，要如何處置？",
                choices: [
                    {
                        text: "☕ 混入咖啡渣與茶葉渣 (補充氮源)",
                        nextScenario: "DAILY_ROUTINE",
                        action: () => { addLog("蚯蚓開心地開始分解咖啡渣！"); }
                    }
                ]
            },
            "DAILY_ROUTINE": {
                chapter: 1,
                chapterTitle: "第 1 章：日常運育 - 資材轉化",
                npcName: "小綠",
                npcRole: "綠色循環工程師",
                avatar: "👩‍🔬",
                text: "「阿酷早安！今天農場又收到社區贊助的有機廢棄資材囉。請密切留意蚯蚓活力與堆肥濕度！」",
                choices: [
                    {
                        text: "🪱 餵食蚯蚓箱：投入咖啡渣與生廚餘",
                        nextScenario: "AFTER_ACTION",
                        action: () => {
                            gameState.unprocessedWaste.coffee = Math.max(0, gameState.unprocessedWaste.coffee - 2);
                            gameState.vermicompost += 1.2;
                            addLog("投入咖啡渣至蚯蚓箱轉化為肥素。");
                        }
                    },
                    {
                        text: "🔥 啟動熱裂解：將枯枝燒製為『生物炭 (Biochar)』",
                        nextScenario: "AFTER_ACTION",
                        action: () => {
                            gameState.unprocessedWaste.dryLeaves = Math.max(0, gameState.unprocessedWaste.dryLeaves - 3);
                            gameState.socScore += 8;
                            addLog("進行無煙熱裂解，製作固定碳生物炭！");
                        }
                    }
                ]
            },
            "AFTER_ACTION": {
                chapter: 1,
                chapterTitle: "第 1 章：日常結算",
                npcName: "農場日誌",
                npcRole: "系統報告",
                avatar: "📊",
                text: "一天忙碌的農場營運結束了！準備進入下一天嗎？",
                choices: [
                    {
                        text: "🌙 結束今日作業，迎接新的一天 (Next Day)",
                        nextScenario: "DAILY_ROUTINE",
                        action: () => {
                            gameState.day += 1;
                            gameState.unprocessedWaste.coffee += 2.0;
                            gameState.unprocessedWaste.dryLeaves += 3.0;
                            addLog(`-- 進入 Day ${gameState.day} --`);
                        }
                    }
                ]
            }
        };

        let gameState = {
            day: 1, chapter: 0, wormVitality: 80, moisture: 70, carbonOffset: 0.0, socScore: 10, vermicompost: 0.0,
            weather: "晴朗微風", unprocessedWaste: { coffee: 5.0, tea: 3.0, foodScraps: 4.0, dryLeaves: 6.0 },
            currentScenarioId: "CH0_START"
        };

        function renderScenario(id) {
            const sc = SCENARIOS[id] || SCENARIOS["CH0_START"];
            gameState.currentScenarioId = id;
            document.getElementById('chapter-title').innerText = sc.chapterTitle;
            document.getElementById('npc-name').innerText = sc.npcName;
            document.getElementById('npc-role').innerText = sc.npcRole;
            document.getElementById('npc-avatar').innerText = sc.avatar;
            document.getElementById('story-text').innerText = sc.text;

            const choicesBox = document.getElementById('choices-container');
            choicesBox.innerHTML = '';
            sc.choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left bg-slate-700 hover:bg-emerald-700 border border-slate-600 p-3 rounded-xl text-xs font-bold transition flex justify-between items-center";
                btn.innerHTML = `<span>${choice.text}</span> <span>➔</span>`;
                btn.onclick = () => {
                    if (choice.action) choice.action();
                    updateUI();
                    renderScenario(choice.nextScenario);
                };
                choicesBox.appendChild(btn);
            });
        }

        function updateUI() {
            document.getElementById('stat-day').innerText = `Day ${gameState.day}`;
            document.getElementById('chapter-badge').innerText = `第 ${gameState.chapter} 章`;
            document.getElementById('stat-worm-text').innerText = `${gameState.wormVitality}%`;
            document.getElementById('stat-moisture-text').innerText = `${gameState.moisture}%`;
            document.getElementById('stat-carbon').innerText = gameState.carbonOffset.toFixed(1);
            document.getElementById('stat-soc').innerText = gameState.socScore;
            
            const list = document.getElementById('materials-list');
            list.innerHTML = `
                <div class="bg-slate-900/80 p-2 rounded-xl text-xs flex justify-between"><span>☕ 咖啡渣</span><span class="font-bold text-amber-400">${gameState.unprocessedWaste.coffee.toFixed(1)}kg</span></div>
                <div class="bg-slate-900/80 p-2 rounded-xl text-xs flex justify-between"><span>🍂 枯枝</span><span class="font-bold text-amber-600">${gameState.unprocessedWaste.dryLeaves.toFixed(1)}kg</span></div>
            `;
        }

        function addLog(text) {
            const logBox = document.getElementById('game-log');
            logBox.innerHTML = `[Day ${gameState.day}] ${text}<br>` + logBox.innerHTML;
        }

        function hardResetGame() {
            localStorage.clear();
            gameState = {
                day: 1, chapter: 0, wormVitality: 80, moisture: 70, carbonOffset: 0.0, socScore: 10, vermicompost: 0.0,
                weather: "晴朗微風", unprocessedWaste: { coffee: 5.0, tea: 3.0, foodScraps: 4.0, dryLeaves: 6.0 },
                currentScenarioId: "CH0_START"
            };
            updateUI();
            renderScenario("CH0_START");
            addLog("系統已強制清除歷史紀錄重置。");
        }

        function saveGame(showNotif) {
            localStorage.setItem('TERRA_CHEF_MINI_SAVE', JSON.stringify(gameState));
            if (showNotif) alert("進度已儲存！");
        }

        window.onload = function() {
            try {
                const saved = localStorage.getItem('TERRA_CHEF_MINI_SAVE');
                if (saved) gameState = JSON.parse(saved);
            } catch(e) {}
            updateUI();
            renderScenario(gameState.currentScenarioId || "CH0_START");
        };
    </script>
</body>
</html>
