        /* 資材轉換碳匯與碳權變現系統 */
        function convertVermiToCarbon() {
            const p = gameState.players.find(x => x.peerId === myPeerId);
            if (!p || p.bankrupt) return;

            if (p.vermiCasting < 5) {
                alert("蚓糞不足！需要至少 5kg 蚓糞才能進行土壤有機質施肥增加碳匯。");
                return;
            }

            p.vermiCasting -= 5;
            p.carbon = Number((p.carbon + 5.0).toFixed(1));
            broadcastState(`${p.name} 使用 5kg 蚓糞進行有機施肥，增加了 5.0kg 碳匯！`);
        }

        function sellCarbonForCoins() {
            const p = gameState.players.find(x => x.peerId === myPeerId);
            if (!p || p.bankrupt) return;

            if (p.carbon < 5.0) {
                alert("碳匯儲量不足！需要至少 5.0kg 碳匯才能進行企業碳權採購變現。");
                return;
            }

            p.carbon = Number((p.carbon - 5.0).toFixed(1));
            p.coins += 15;
            broadcastState(`${p.name} 成功將 5.0kg 碳匯對外賣出變現，獲得 15 碳幣！`);
        }

        /* 6x6 20 格完美外環網格佈局渲染 (Exact 20 Outer Ring) */
        function renderBoard() {
            const container = document.getElementById('board-container');
            container.innerHTML = '';
            
            // 6x6 外環座標對應表 (上邊 6 格 + 右邊 4 格 + 下邊 6 格 + 左邊 4 格 = 20 格)
            const ringCoords = [
                // 上邊 (Row 1, Col 1 -> 6) : 6 格
                { r: 1, c: 1 }, { r: 1, c: 2 }, { r: 1, c: 3 }, { r: 1, c: 4 }, { r: 1, c: 5 }, { r: 1, c: 6 },
                // 右邊 (Row 2 -> 5, Col 6) : 4 格
                { r: 2, c: 6 }, { r: 3, c: 6 }, { r: 4, c: 6 }, { r: 5, c: 6 },
                // 下邊 (Row 6, Col 6 -> 1) : 6 格
                { r: 6, c: 6 }, { r: 6, c: 5 }, { r: 6, c: 4 }, { r: 6, c: 3 }, { r: 6, c: 2 }, { r: 6, c: 1 },
                // 左邊 (Row 5 -> 2, Col 1) : 4 格
                { r: 5, c: 1 }, { r: 4, c: 1 }, { r: 3, c: 1 }, { r: 2, c: 1 }
            ];

            BOARD_TILES.forEach((tile, idx) => {
                const pos = ringCoords[idx] || { r: 1, c: 1 };
                const el = document.createElement('div');
                el.style.gridRowStart = pos.r;
                el.style.gridColumnStart = pos.c;

                const prop = gameState.propertyData[tile.id];
                const owner = prop ? gameState.players.find(p => p.peerId === prop.ownerPeerId) : null;
                const ownerBorder = owner ? `border-2 border-[${owner.color}]` : 'border border-slate-800';

                let icon = tile.icon;
                let levelTag = '';
                // 顯示依投資總額更新的最新過路費/地價
                let displayPrice = tile.landPrice > 0 ? `${tile.landPrice}🪙` : '';

                if (prop) {
                    if (prop.facilities && prop.facilities.length > 0) {
                        icon = FACILITY_TYPES[prop.facilities[0]].icon;
                        levelTag = prop.facilities.length > 1 ? `+${prop.facilities.length-1}` : '🏭';
                    }
                    if (prop.ownerPeerId) {
                        displayPrice = `<span class="text-amber-300 font-bold">總價:${prop.totalInvestment}🪙</span>`;
                    }
                }

                let tokens = '';
                gameState.players.forEach(p => {
                    if (p.pos === idx && !p.bankrupt) {
                        tokens += `<span class="text-xl sm:text-2xl font-black inline-block animated-token drop-shadow-[0_2px_8px_rgba(16,185,129,0.8)]" title="${p.name}">${p.avatar}</span>`;
                    }
                });

                el.className = `bg-slate-900/90 rounded-xl p-1.5 ${ownerBorder} flex flex-col justify-between items-center text-center relative overflow-hidden shadow-md`;
                el.innerHTML = `
                    <div class="flex gap-1 items-center justify-center min-h-[28px] my-0.5">${tokens}</div>
                    <div class="text-lg sm:text-2xl">${icon} <span class="text-[10px] text-amber-300 font-bold">${levelTag}</span></div>
                    <span class="text-[10px] sm:text-[11px] text-slate-100 font-black truncate w-full">${tile.name}</span>
                    <span class="text-[8px] sm:text-[9px] text-amber-400 font-mono">${displayPrice}</span>
                `;
                container.appendChild(el);
            });
        }
