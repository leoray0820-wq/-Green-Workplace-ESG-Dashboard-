<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>綠色職場永續數據儀表板 | 企業稽核版</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        forest: { 50: '#f0f7f4', 100: '#e0efe9', 500: '#2d6a4f', 600: '#1b4332', 700: '#081c15' },
                        emerald: { 500: '#10b981' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <!-- Header -->
    <header class="bg-forest-600 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-emerald-500 rounded-lg text-forest-700">
                    <i data-lucide="shield-check" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">綠色職場永續數據儀表板</h1>
                    <p class="text-xs text-emerald-200">GRI 306 & TNFD 雲端稽核與透明追溯系統</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2 flex-wrap">
                <button onclick="loadCloudData()" class="bg-forest-500 hover:bg-forest-700 text-white border border-emerald-400 px-3 py-2 rounded-lg text-sm font-medium flex items-center shadow-sm transition">
                    <i data-lucide="refresh-cw" class="w-4 h-4 mr-1.5" id="sync-spinner"></i> 同步雲端
                </button>
                <button onclick="openModal('waste')" class="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-2 rounded-lg text-sm font-medium flex items-center shadow-sm transition">
                    <i data-lucide="plus-circle" class="w-4 h-4 mr-1.5"></i> 填報廚餘
                </button>
                <button onclick="openModal('bio')" class="bg-forest-700 hover:bg-black text-white px-3 py-2 rounded-lg text-sm font-medium flex items-center shadow-sm transition">
                    <i data-lucide="bug" class="w-4 h-4 mr-1.5"></i> 生態觀察
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

        <!-- KPI Impact Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-100 flex items-center space-x-4">
                <div class="p-3 bg-emerald-100 text-emerald-600 rounded-xl"><i data-lucide="scale" class="w-8 h-8"></i></div>
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">累計廢棄物轉化</p>
                    <p class="text-2xl font-bold text-slate-800" id="kpi-total-waste">0.0 <span class="text-sm font-normal text-slate-500">kg</span></p>
                    <p class="text-xs text-emerald-600 mt-1">GRI 306-4 規範追溯</p>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-100 flex items-center space-x-4">
                <div class="p-3 bg-teal-100 text-teal-600 rounded-xl"><i data-lucide="cloud-off" class="w-8 h-8"></i></div>
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">範疇三減碳效益</p>
                    <p class="text-2xl font-bold text-slate-800" id="kpi-carbon-reduced">0.0 <span class="text-sm font-normal text-slate-500">kg CO₂e</span></p>
                    <p class="text-xs text-teal-600 mt-1">替代係數 2.1 kgCO₂e/kg</p>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-100 flex items-center space-x-4">
                <div class="p-3 bg-amber-100 text-amber-600 rounded-xl"><i data-lucide="sparkles" class="w-8 h-8"></i></div>
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">產出有機蚓糞肥</p>
                    <p class="text-2xl font-bold text-slate-800" id="kpi-vermicompost">0.0 <span class="text-sm font-normal text-slate-500">kg</span></p>
                    <p class="text-xs text-amber-600 mt-1">土壤有機碳 SOC 增匯</p>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-100 flex items-center space-x-4">
                <div class="p-3 bg-indigo-100 text-indigo-600 rounded-xl"><i data-lucide="camera" class="w-8 h-8"></i></div>
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">雲端憑證照片</p>
                    <p class="text-2xl font-bold text-slate-800" id="kpi-bio-logs">0 <span class="text-sm font-normal text-slate-500">張存證</span></p>
                    <p class="text-xs text-indigo-600 mt-1">TNFD 資訊透明度</p>
                </div>
            </div>
        </div>

        <!-- Trend Chart Section -->
        <div class="bg-white rounded-xl shadow-sm p-6 border border-slate-100">
            <h2 class="text-base font-bold text-slate-800 mb-4 flex items-center">
                <i data-lucide="trending-up" class="w-5 h-5 mr-2 text-forest-500"></i>
                全公司廢棄物轉化趨勢分析
            </h2>
            <div class="h-72">
                <canvas id="trendChart"></canvas>
            </div>
        </div>

        <!-- Data Table Section -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="p-6 border-b border-slate-100 flex flex-wrap justify-between items-center gap-4">
                <div>
                    <h2 class="text-base font-bold text-slate-800">歷史稽核數據清單</h2>
                    <p class="text-xs text-slate-400">數據已同步至 Google 試算表，圖片已存入 Google 雲端硬碟</p>
                </div>
                <div class="flex items-center space-x-3">
                    <input type="text" id="table-search" oninput="renderTable()" placeholder="搜尋類別、部門或備註..." class="border border-slate-200 rounded-lg px-3 py-1.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                    <button onclick="exportCSV()" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center shadow-sm transition">
                        <i data-lucide="download" class="w-4 h-4 mr-2"></i> 導出 CSV
                    </button>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b border-slate-100">
                            <th class="p-4">雲端憑證照片</th>
                            <th class="p-4">日期</th>
                            <th class="p-4">記錄類型</th>
                            <th class="p-4">細項類別 / 主題</th>
                            <th class="p-4">數量 / 評分</th>
                            <th class="p-4">估算減碳量</th>
                            <th class="p-4">記錄部門</th>
                            <th class="p-4">現場備註</th>
                        </tr>
                    </thead>
                    <tbody id="data-table-body" class="divide-y divide-slate-100 text-slate-700">
                        <!-- Dynamic Rows -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Form -->
    <div id="modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden flex flex-col max-h-[90vh]">
            <div class="bg-forest-600 text-white p-4 px-6 flex justify-between items-center">
                <h3 id="modal-title" class="text-lg font-bold flex items-center">
                    <i data-lucide="cloud-upload" class="w-5 h-5 mr-2"></i> 雲端數據填報
                </h3>
                <button onclick="closeModal()" class="text-slate-200 hover:text-white"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>

            <form id="record-form" onsubmit="handleCloudSubmit(event)" class="p-6 space-y-4 overflow-y-auto flex-1">
                <input type="hidden" id="form-type" value="waste">

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">日期</label>
                    <input type="date" id="form-date" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>

                <div id="field-category-waste">
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">廢棄物/資材種類</label>
                    <select id="form-category-waste" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                        <option value="咖啡渣">辦公室咖啡渣</option>
                        <option value="茶渣">茶葉渣/茶包</option>
                        <option value="團膳廚餘">員工團膳廚餘 (植物性)</option>
                        <option value="園區落葉">園區落葉與枯枝</option>
                    </select>
                </div>

                <div id="field-amount-waste">
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">投放重量 (kg)</label>
                    <input type="number" step="0.1" id="form-amount" placeholder="例如：12.5" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>

                <div id="field-bio-details" class="hidden space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">觀察主題</label>
                        <input type="text" id="form-bio-title" placeholder="例如：蚯蚓翻耕活躍度 / 土壤蕈類觀察" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">蚯蚓活躍度評分 (1-5 星)</label>
                        <select id="form-worm-rating" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                            <option value="5">⭐⭐⭐⭐⭐ (極度活躍/集群明顯)</option>
                            <option value="4">⭐⭐⭐⭐ (良好進食)</option>
                            <option value="3">⭐⭐⭐ (正常活動)</option>
                            <option value="2">⭐⭐ (活動偏緩慢)</option>
                            <option value="1">⭐ (需要調整環境濕度/通氣)</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">現場照片存證 (自動上傳雲端硬碟)</label>
                    <input type="file" id="form-photo" accept="image/*" onchange="compressImage(event)" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-forest-50 file:text-forest-600 hover:file:bg-forest-100">
                    <div id="photo-preview-container" class="mt-3 hidden relative w-32 h-32 rounded-lg border border-slate-200 overflow-hidden">
                        <img id="photo-preview" src="" class="w-full h-full object-cover">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">記錄部門 / 填寫人</label>
                    <input type="text" id="form-dept" placeholder="例如：行政總務部 / 劉小明" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">備註 / 生物狀態紀錄</label>
                    <textarea id="form-notes" rows="3" placeholder="紀錄現場氣味、濕度或特異觀察..." class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none"></textarea>
                </div>

                <div class="pt-4 flex justify-end space-x-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-200 text-slate-600 rounded-lg text-sm font-medium hover:bg-slate-50">取消</button>
                    <button type="submit" id="submit-btn" class="px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-white rounded-lg text-sm font-medium shadow-sm">確認並上傳雲端</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Frontend Production Script -->
    <script>
        // ⚠️ 請務必替換為您從 Google Apps Script 部署獲得的網頁應用程式網址 ⚠️
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/library/d/1WnudsI-kacr-dblsX4hUJzM4XHOhIN9gVMABbCJ_hR8I1yl5mFOsAyMq/1";

        let cloudRecords = [];
        let compressedPhotoBase64 = '';
        let chartInstance = null;

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('form-date').value = new Date().toISOString().split('T')[0];
            loadCloudData();
            lucide.createIcons();
        });

        function loadCloudData() {
            const spinner = document.getElementById('sync-spinner');
            if (spinner) spinner.classList.add('animate-spin');

            fetch(GOOGLE_SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    cloudRecords = Array.isArray(data) ? data : [];
                    updateDashboard();
                })
                .catch(err => {
                    console.error("Cloud fetch failed:", err);
                    alert("無法連線至雲端資料庫，請檢查 Apps Script 網址是否正確。");
                })
                .finally(() => {
                    if (spinner) spinner.classList.remove('animate-spin');
                });
        }

        function updateDashboard() {
            const totalWaste = cloudRecords.filter(i => i.type === 'waste').reduce((acc, curr) => acc + (parseFloat(curr.amount) || 0), 0);
            const carbonReduced = totalWaste * 2.1;
            const vermicompost = totalWaste * 0.3;
            const photoCount = cloudRecords.filter(i => i.photo && i.photo.startsWith('http')).length;

            document.getElementById('kpi-total-waste').innerHTML = `${totalWaste.toFixed(1)} <span class="text-sm font-normal text-slate-500">kg</span>`;
            document.getElementById('kpi-carbon-reduced').innerHTML = `${carbonReduced.toFixed(1)} <span class="text-sm font-normal text-slate-500">kg CO₂e</span>`;
            document.getElementById('kpi-vermicompost').innerHTML = `${vermicompost.toFixed(1)} <span class="text-sm font-normal text-slate-500">kg</span>`;
            document.getElementById('kpi-bio-logs').innerHTML = `${photoCount} <span class="text-sm font-normal text-slate-500">張存證</span>`;

            renderChart();
            renderTable();
        }

        function renderChart() {
            const ctx = document.getElementById('trendChart').getContext('2d');
            const wasteByDate = {};
            
            cloudRecords.filter(i => i.type === 'waste').forEach(item => {
                wasteByDate[item.date] = (wasteByDate[item.date] || 0) + item.amount;
            });

            const labels = Object.keys(wasteByDate).sort();
            const data = labels.map(date => wasteByDate[date]);

            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '每日投放廢棄物 (kg)',
                        data: data,
                        backgroundColor: '#10b981',
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, grid: { color: '#f1f5f9' } },
                        x: { grid: { display: false } }
                    }
                }
            });
        }

        function renderTable() {
            const search = document.getElementById('table-search').value.toLowerCase();
            const tbody = document.getElementById('data-table-body');
            tbody.innerHTML = '';

            const filtered = cloudRecords.filter(item => 
                (item.category && item.category.toLowerCase().includes(search)) ||
                (item.dept && item.dept.toLowerCase().includes(search)) ||
                (item.notes && item.notes.toLowerCase().includes(search))
            );

            filtered.slice().reverse().forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition";
                
                const isWaste = item.type === 'waste';
                const amountText = isWaste ? `${item.amount} kg` : `⭐ ${item.rating || '-'} 星`;
                const carbonText = isWaste ? `${item.carbon} kg` : '-';
                
                const photoLink = item.photo ? 
                    `<a href="${item.photo}" target="_blank" class="inline-flex items-center text-xs font-semibold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md hover:bg-indigo-100 transition"><i data-lucide="external-link" class="w-3 h-3 mr-1"></i>檢視憑證</a>` : 
                    `<span class="text-xs text-slate-300">無照片</span>`;

                tr.innerHTML = `
                    <td class="p-4">${photoLink}</td>
                    <td class="p-4 text-xs font-semibold text-slate-500">${item.date}</td>
                    <td class="p-4"><span class="px-2.5 py-1 text-xs font-semibold rounded-full ${isWaste ? 'bg-emerald-100 text-emerald-700' : 'bg-indigo-100 text-indigo-700'}">${isWaste ? '廚餘投放' : '生物觀察'}</span></td>
                    <td class="p-4 font-medium">${item.category || '-'}</td>
                    <td class="p-4 font-bold text-slate-800">${amountText}</td>
                    <td class="p-4 text-teal-600 font-semibold text-xs">${carbonText}</td>
                    <td class="p-4 text-xs text-slate-500">${item.dept}</td>
                    <td class="p-4 text-xs text-slate-400 max-w-xs truncate">${item.notes || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
            lucide.createIcons();
        }

        function compressImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const MAX_HEIGHT = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    compressedPhotoBase64 = canvas.toDataURL('image/jpeg', 0.65);
                    document.getElementById('photo-preview').src = compressedPhotoBase64;
                    document.getElementById('photo-preview-container').classList.remove('hidden');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function openModal(type) {
            document.getElementById('form-type').value = type;
            document.getElementById('modal').classList.remove('hidden');
            
            if (type === 'waste') {
                document.getElementById('modal-title').innerHTML = `<i data-lucide="cloud-upload" class="w-5 h-5 mr-2"></i> 填報廚餘 / 資源循環`;
                document.getElementById('field-category-waste').classList.remove('hidden');
                document.getElementById('field-amount-waste').classList.remove('hidden');
                document.getElementById('field-bio-details').classList.add('hidden');
            } else {
                document.getElementById('modal-title').innerHTML = `<i data-lucide="bug" class="w-5 h-5 mr-2"></i> 填報生物多樣性觀察`;
                document.getElementById('field-category-waste').classList.add('hidden');
                document.getElementById('field-amount-waste').classList.add('hidden');
                document.getElementById('field-bio-details').classList.remove('hidden');
            }
            lucide.createIcons();
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
            document.getElementById('record-form').reset();
            compressedPhotoBase64 = '';
            document.getElementById('photo-preview-container').classList.add('hidden');
        }

        function handleCloudSubmit(event) {
            event.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 mr-2 animate-spin inline"></i> 正在安全上傳至雲端...`;
            lucide.createIcons();

            const type = document.getElementById('form-type').value;
            const payload = {
                id: Date.now(),
                date: document.getElementById('form-date').value,
                type: type,
                dept: document.getElementById('form-dept').value,
                notes: document.getElementById('form-notes').value,
                photoBase64: compressedPhotoBase64
            };

            if (type === 'waste') {
                payload.category = document.getElementById('form-category-waste').value;
                payload.amount = parseFloat(document.getElementById('form-amount').value) || 0;
            } else {
                payload.category = '生物多樣性';
                payload.title = document.getElementById('form-bio-title').value;
                payload.rating = parseInt(document.getElementById('form-worm-rating').value);
            }

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(res => {
                if(res.status === "success") {
                    alert('🎉 資料與現場憑證照片已成功寫入雲端！');
                    closeModal();
                    loadCloudData();
                } else {
                    alert('上傳失敗: ' + (res.message || '未知錯誤'));
                }
            })
            .catch(err => {
                console.error("Submission error:", err);
                alert('網路連線異常，請確認 Apps Script 部署設定是否為「任何人」');
            })
            .finally(() => {
                btn.disabled = false;
                btn.innerHTML = `確認並上傳雲端`;
            });
        }

        function exportCSV() {
            let csv = '\uFEFFID,日期,類型,細項類別,數量或評分,估算減碳(kgCO2e),記錄部門,備註,Google Drive 憑證網址\n';

            cloudRecords.forEach(item => {
                const isWaste = item.type === 'waste';
                csv += `"${item.id}","${item.date}","${isWaste ? '廚餘投放' : '生物觀察'}","${item.category}","${isWaste ? item.amount : item.rating}","${item.carbon}","${item.dept}","${(item.notes||'').replace(/"/g, '""')}","${item.photo||''}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `ESG_Audit_Report_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
        }
    </script>
</body>
</html>
