<!DOCTYPE html>
<html lang="zh-TW" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>歸蚓酷客：生態循環大亨 (Vermicompost Guardian: Circular Eco-Tycoon & RPG)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts: Noto Sans TC & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  
  <style>
    body {
      font-family: 'Noto Sans TC', 'Inter', sans-serif;
      user-select: none;
    }
    
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.8);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(16, 185, 129, 0.4);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(16, 185, 129, 0.8);
    }

    .glow-green { box-shadow: 0 0 12px rgba(16, 185, 129, 0.3); }
    .glow-amber { box-shadow: 0 0 12px rgba(245, 158, 11, 0.3); }

    .card-item {
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .card-item:hover:not(.disabled) {
      transform: translateY(-6px) scale(1.02);
      z-index: 20;
    }

    @keyframes pulse-border {
      0%, 100% { border-color: rgba(239, 68, 68, 0.9); }
      50% { border-color: rgba(239, 68, 68, 0.2); }
    }
    .pulse-danger {
      animation: pulse-border 1.5s infinite;
    }
  </style>
</head>
<body class="h-full overflow-hidden flex flex-col bg-slate-950 text-slate-100">

  <!-- TOP HUD -->
  <header class="h-14 bg-slate-900/90 border-b border-emerald-900/40 px-3 sm:px-4 flex items-center justify-between z-20 shrink-0">
    <div class="flex items-center space-x-2.5">
      <div class="w-8 h-8 rounded-lg bg-emerald-950 border border-emerald-500/40 flex items-center justify-center text-emerald-400 text-lg font-black shadow-inner glow-green">
        <i class="fa-solid fa-worm"></i>
      </div>
      <div>
        <h1 class="text-xs sm:text-sm font-bold tracking-wider text-emerald-400 uppercase">歸蚓酷客：生態循環大亨</h1>
        <div class="text-[10px] text-slate-400 flex items-center gap-2">
          <button onclick="toggleGamePause()" id="pause-btn" class="hover:text-emerald-300 text-amber-400 font-bold flex items-center gap-1">
            <i class="fa-solid fa-pause" id="pause-icon"></i> <span id="pause-text">運行中</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Main Dynamic Indicators -->
    <div class="flex items-center space-x-2 sm:space-x-3 text-xs">
      <div class="flex items-center space-x-1 bg-slate-800/90 px-2 py-1 rounded-lg border border-slate-700" title="新台幣資金 (NT$)">
        <i class="fa-solid fa-sack-dollar text-amber-400"></i>
        <span id="hud-coins" class="font-black text-amber-400">NT$ 5,000</span>
      </div>

      <div class="flex items-center space-x-1 bg-slate-800/90 px-2 py-1 rounded-lg border border-slate-700" title="蚓糞庫存">
        <i class="fa-solid fa-cubes-stacked text-amber-600"></i>
        <span id="hud-vermicompost" class="font-bold text-amber-200">0.0 Kg</span>
      </div>

      <div class="flex items-center space-x-1 bg-slate-800/90 px-2 py-1 rounded-lg border border-slate-700" title="累積土壤碳匯量 (tCO2e)">
        <i class="fa-solid fa-seedling text-emerald-400"></i>
        <span id="hud-carbon-seq" class="font-bold text-emerald-300">0.000 t</span>
      </div>

      <div class="flex items-center space-x-1.5 bg-slate-800/90 px-2 py-1 rounded-lg border border-slate-700">
        <i class="fa-solid fa-award text-cyan-400"></i>
        <span class="font-bold text-slate-200">Lv.<span id="hud-level">1</span></span>
        <div class="w-12 bg-slate-950 h-1.5 rounded-full overflow-hidden border border-slate-700 hidden sm:block">
          <div id="hud-exp-bar" class="bg-cyan-400 h-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>

      <div class="hidden md:flex items-center space-x-1 bg-slate-800/90 px-2 py-1 rounded-lg border border-slate-700" title="出戰卡牌容量">
        <i class="fa-solid fa-box-archive text-purple-400"></i>
        <span id="hud-deck-cap" class="font-bold text-purple-300">3/3</span>
      </div>
    </div>

    <!-- Odor PPM Badge -->
    <div class="flex items-center space-x-2">
      <div id="hud-odor-badge" class="text-[11px] bg-slate-800 border border-slate-700 text-slate-300 px-2 py-1 rounded-lg flex items-center gap-1">
        <i class="fa-solid fa-wind" id="odor-icon"></i>
        <span class="hidden sm:inline">異味 PPM:</span> <span id="hud-odor-val" class="font-bold">0 PPM</span>
      </div>
    </div>
  </header>

  <!-- NAVIGATION TABS -->
  <nav class="bg-slate-900 border-b border-slate-800 px-3 py-1.5 flex items-center justify-center space-x-1 sm:space-x-2 overflow-x-auto shrink-0 text-xs font-bold">
    <button onclick="switchTab('compost')" id="tab-btn-compost" class="tab-btn px-2.5 py-1 rounded-lg transition flex items-center gap-1 text-emerald-400 bg-slate-800 border border-emerald-500/40">
      <i class="fa-solid fa-vial-virus"></i> 堆肥主控台
    </button>
    <button onclick="switchTab('deck')" id="tab-btn-deck" class="tab-btn px-2.5 py-1 rounded-lg transition flex items-center gap-1 text-slate-400 hover:text-slate-200">
      <i class="fa-solid fa-cards"></i> 戰術牌組
    </button>
    <button onclick="switchTab('skills')" id="tab-btn-skills" class="tab-btn px-2.5 py-1 rounded-lg transition flex items-center gap-1 text-slate-400 hover:text-slate-200 relative">
      <i class="fa-solid fa-user-ninja"></i> 天賦技能樹 (10種)
      <span id="badge-skill-pts" class="hidden px-1.5 py-0.2 bg-rose-500 text-white rounded-full text-[9px]">0</span>
    </button>
    <button onclick="switchTab('tech')" id="tab-btn-tech" class="tab-btn px-2.5 py-1 rounded-lg transition flex items-center gap-1 text-slate-400 hover:text-slate-200">
      <i class="fa-solid fa-diagram-project"></i> 科技樹 (20項)
    </button>
    <button onclick="switchTab('shop')" id="tab-btn-shop" class="tab-btn px-2.5 py-1 rounded-lg transition flex items-center gap-1 text-slate-400 hover:text-slate-200">
      <i class="fa-solid fa-shirt"></i> 4部位裝備
    </button>
    <button onclick="switchTab('carbon')" id="tab-btn-carbon" class="tab-btn px-2.5 py-1 rounded-lg transition flex items-center gap-1 text-slate-400 hover:text-slate-200">
      <i class="fa-solid fa-chart-line"></i> 碳權交易所
    </button>
  </nav>

  <!-- MAIN CONTAINER -->
  <main id="main-view" class="flex-1 relative overflow-hidden bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950 flex flex-col">
  </main>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none bg-slate-800 border border-emerald-500/50 text-emerald-300 px-3.5 py-2.5 rounded-xl shadow-2xl flex items-center gap-2.5">
    <i id="toast-icon" class="fa-solid fa-circle-info text-emerald-400 text-sm"></i>
    <span id="toast-msg" class="text-xs font-bold">通知訊息</span>
  </div>

  <script>
    /* =========================================================================
       1. CONSTANTS & DEFINITIONS
       ========================================================================= */

    const CARD_TYPES = {
      CARBON: { name: '高碳資材', color: 'from-amber-950 to-amber-900 border-amber-600/60 text-amber-300' },
      SERVICE: { name: '社區服務', color: 'from-emerald-950 to-teal-950 border-emerald-600/60 text-emerald-300' },
      AERATION: { name: '翻堆通氣', color: 'from-blue-950 to-indigo-950 border-blue-600/60 text-blue-300' },
      HARVEST: { name: '採收篩分', color: 'from-yellow-950 to-lime-950 border-lime-600/60 text-lime-300' },
      SPECIAL: { name: '生物調理劑', color: 'from-purple-950 to-pink-950 border-purple-600/60 text-purple-300' }
    };

    const MASTER_CARDS = [
      { id: 'c_community_leaves', name: '社區落葉收集 (C/N ~60)', type: 'SERVICE', cost: 1, basePrice: 150, unlocked: true, desc: '收集社區落葉。C/N比 +4.5，含水率 -3.0%，處理廢棄物。' },
      { id: 'c_sawdust', name: '乾燥木屑/稻殼 (C/N ~200)', type: 'CARBON', cost: 1, basePrice: 200, unlocked: true, desc: '添加濃縮高碳資材。C/N比 +8.0，含水率 -5.0%，異味 -15 PPM。' },
      { id: 'c_aerate', name: '手工翻堆通氣', type: 'AERATION', cost: 1, basePrice: 150, unlocked: true, desc: '翻動堆體增加好氧菌活力。通氣量 +25%，堆體溫度 -2.0°C。' },
      { id: 'c_harvest', name: '優質蚓糞篩分採收', type: 'HARVEST', cost: 2, basePrice: 350, unlocked: true, desc: '篩分採收熟成蚓糞。獲得 30 Kg 蚓糞。' },
      
      { id: 'c_biochar', name: '高溫多孔生物炭 (C/N ~300)', type: 'CARBON', cost: 2, basePrice: 500, unlocked: false, techReq: 'tech_biochar', desc: '高效吸附異味與多餘水分。C/N比 +15.0，含水率 -8.0%，異味 -40 PPM。' },
      { id: 'c_lime', name: '熟石灰/蛋殼微粉', type: 'SPECIAL', cost: 1, basePrice: 300, unlocked: false, techReq: 'tech_microbe_lowtemp', desc: '快速中和高氮導致的酸化環境。pH值 +0.8。' },
      { id: 'c_em_spray', name: '高滲透好氧酵素菌劑', type: 'SPECIAL', cost: 2, basePrice: 700, unlocked: false, techReq: 'tech_enzyme', desc: '加速有機質好氧分解。異味 -30 PPM，分解速度提升。' },
      { id: 'c_worm_boost', name: '蚯蚓孵化催化劑', type: 'SPECIAL', cost: 2, basePrice: 900, unlocked: false, techReq: 'tech_incubator', desc: '刺激繁殖與成長。增加 0.8 kg 蚯蚓 (~1,600 條)。' },
      { id: 'c_auto_harvest', name: '滾筒離心篩分機', type: 'HARVEST', cost: 3, basePrice: 1200, unlocked: false, techReq: 'tech_sifter', desc: '大規模自動採收。獲得 80 Kg 蚓糞。' }
    ];

    // 10 SKILL NODES (Max level 5 each)
    const SKILL_TREE_NODES = [
      { id: 'sk_density', name: '【蚯蚓極限馴化】', desc: '系統每平方米最大容納密度從 3.0 kg/m² 擴充至 6.0 kg/m² (+0.6 kg/m²/級)，減少高密度逃亡。', cost: 1, level: 0, maxLevel: 5 },
      { id: 'sk_cn_control', name: '【好氧堆肥大師】', desc: '使用高碳資材卡牌時，C/N 比調控效率與乾燥吸水效果提升 +20%/級。', cost: 1, level: 0, maxLevel: 5 },
      { id: 'sk_community', name: '【社區運籌學】', desc: '發動落葉收集卡牌時，獲得落葉量 +25%/級，並額外獲得 +10 ESG 經驗/級。', cost: 1, level: 0, maxLevel: 5 },
      { id: 'sk_carbon_audit', name: '【碳匯精算師】', desc: '每單位蚓糞轉換為碳權的認證轉換率 +10%/級，企業收購價格 +5%/級。', cost: 1, level: 0, maxLevel: 5 },
      { id: 'sk_odor_mitigate', name: '【優質品質控管】', desc: '異味值 (Odor PPM) 對蚯蚓逃亡與死亡的負面打擊降低 -15%/級。', cost: 1, level: 0, maxLevel: 5 },
      { id: 'sk_climate_guard', name: '【極端氣候防護】', desc: '降低堆體溫度過高(>32°C)或過低(<15°C)造成的蚯蚓死亡率 -20%/級。', cost: 1, level: 0, maxLevel: 5 },
      { id: 'sk_bargain', name: '【資材談判專家】', desc: '卡牌商店補充卡牌與購買裝備的 NT$ 費用折扣 -5%/級。', cost: 1, level: 0, maxLevel: 5 },
      { id: 'sk_breed_master', name: '【超能繁殖培育】', desc: '最適環境下蚯蚓每日繁殖速率 +15%/級。', cost: 1, level: 0, maxLevel: 5 },
      { id: 'sk_agile_ap', name: '【敏捷分揀技巧】', desc: '最大行動點數 (AP) +1 (每 2 級)，處理廢棄物效率 +10%/級。', cost: 1, level: 0, maxLevel: 5 },
      { id: 'sk_esg_prestige', name: '【環保巡查公信力】', desc: '完成各類廢棄物處理任務獲得的 ESG 經驗值 (EXP) +20%/級。', cost: 1, level: 0, maxLevel: 5 }
    ];

    // 20 TECH NODES IN 4 DOMAINS
    const TECH_TREE_NODES = [
      // Domain 1: 基礎設施
      { id: 'tech_box_1', domain: '基礎設施', name: '1. 基礎木製堆肥箱', cost: 0, desc: '預設解鎖基礎養殖箱體 (0.5 m²)。', unlocked: true },
      { id: 'tech_mesh', domain: '基礎設施', name: '2. 通風防蟲網模組', cost: 2000, desc: '防止害蟲入侵並改善氣體通氣率。', unlocked: false, req: 'tech_box_1' },
      { id: 'tech_drain', domain: '基礎設施', name: '4. 水分滲透排水盤', cost: 3500, desc: '防止底部積水溺水，提高極限含水容忍度。', unlocked: false, req: 'tech_mesh' },
      { id: 'tech_shade', domain: '基礎設施', name: '7. 極端氣候遮陽棚', cost: 6000, desc: '減緩戶外曝曬高溫上升速度 -30%。', unlocked: false, req: 'tech_drain' },
      { id: 'tech_steel_box', domain: '基礎設施', name: '15. 模組化不鏽鋼蚯蚓箱 V1.0', cost: 15000, desc: '擴充養殖面積至 2.0 m²，提高上限。', unlocked: false, req: 'tech_shade', apply: () => { gameState.compost.areaM2 = 2.0; } },

      // Domain 2: 微生物與資材
      { id: 'tech_microbe_lowtemp', domain: '微生物與資材', name: '3. 低溫微生物菌種', cost: 2800, desc: '解鎖「熟石灰/蛋殼微粉」酸鹼調理卡牌。', unlocked: false, req: 'tech_box_1' },
      { id: 'tech_shredder', domain: '微生物與資材', name: '5. 落葉高效粉碎機', cost: 4000, desc: '使落葉卡牌的 C/N 提升效果增強 30%。', unlocked: false, req: 'tech_microbe_lowtemp' },
      { id: 'tech_biochar', domain: '微生物與資材', name: '9. 生物炭吸附層', cost: 8000, desc: '解鎖「高溫多孔生物炭」強效去味固碳卡牌。', unlocked: false, req: 'tech_shredder' },
      { id: 'tech_pre_ferment', domain: '微生物與資材', name: '12. 高氮廚餘預發酵槽', cost: 12000, desc: '降低送達廚餘的初始異味 -40%。', unlocked: false, req: 'tech_biochar' },
      { id: 'tech_enzyme', domain: '微生物與資材', name: '13. 高滲透性生物酵素', cost: 14000, desc: '解鎖「高滲透好氧酵素菌劑」卡牌。', unlocked: false, req: 'tech_pre_ferment' },

      // Domain 3: 感測器與自動化
      { id: 'tech_sensor', domain: '感測器與自動化', name: '6. 智能溫濕度感測器', cost: 5000, desc: '即時精確警報，調控卡牌效果 +15%。', unlocked: false, req: 'tech_box_1' },
      { id: 'tech_misting', domain: '感測器與自動化', name: '8. 噴霧自動補水系統', cost: 7000, desc: '水分低於 50% 時自動補水，防止乾枯。', unlocked: false, req: 'tech_sensor' },
      { id: 'tech_sifter', domain: '感測器與自動化', name: '10. 蚓糞篩分機械機', cost: 9000, desc: '解鎖「滾筒離心篩分機」自動採收卡牌。', unlocked: false, req: 'tech_misting' },
      { id: 'tech_incubator', domain: '感測器與自動化', name: '11. 蚯蚓孵化促進箱', cost: 10000, desc: '解鎖「蚯蚓孵化催化劑」卡牌，繁殖上限 +20%。', unlocked: false, req: 'tech_sifter' },
      { id: 'tech_solar_fan', domain: '感測器與自動化', name: '14. 太陽能循環風扇', cost: 13000, desc: '維持內部基礎通氣率，減少厭氧發酵。', unlocked: false, req: 'tech_incubator' },

      // Domain 4: 高階碳資產
      { id: 'tech_liquid_refine', domain: '高階碳資產', name: '16. 蚓萃液肥精煉機', cost: 18000, desc: '解鎖有機液肥自動累積與銷售。', unlocked: false, req: 'tech_box_1' },
      { id: 'tech_iso14064', domain: '高階碳資產', name: '17. ISO 14064 碳足跡盤查', cost: 22000, desc: '碳權銷售單價提高 25%。', unlocked: false, req: 'tech_liquid_refine' },
      { id: 'tech_vcs_standard', domain: '高階碳資產', name: '18. VCS 國際碳權認證標準', cost: 30000, desc: '解鎖高階大宗碳權合約交易。', unlocked: false, req: 'tech_iso14064' },
      { id: 'tech_ai_closedloop', domain: '高階碳資產', name: '19. AI 微氣候閉環調控', cost: 40000, desc: '自動維持最適 C/N 比與濕度。', unlocked: false, req: 'tech_vcs_standard' },
      { id: 'tech_zero_farm', domain: '高階碳資產', name: '20. 零碳循環示範農場', cost: 60000, desc: '終極科技：ESG 經驗與碳權收益翻倍！', unlocked: false, req: 'tech_ai_closedloop' }
    ];

    // RPG GEAR (Head, Body, Hands, Feet)
    const BASE_EQUIPMENT = [
      { id: 'h_1', slot: 'head', minLevel: 1, name: '工安防塵透氣面罩', price: 800, desc: '防護堆肥粉塵與微粒，工作效率 +5%' },
      { id: 'h_2', slot: 'head', minLevel: 3, name: '專業活性碳雙濾毒面具', price: 2500, desc: '大幅降低臭味影響，異味損害 -15%' },
      
      { id: 'b_1', slot: 'body', minLevel: 1, name: '耐磨帆布堆肥工作服', price: 1200, desc: '分解效能 +5%' },
      { id: 'b_2', slot: 'body', minLevel: 4, name: '高能溫控外骨骼工作服', price: 6500, desc: '分解效能 +15%，最大 AP +1' },

      { id: 'g_1', slot: 'hands', minLevel: 1, name: '厚實防滑橡膠手套', price: 600, desc: '翻堆與採收速度 +5%' },
      { id: 'g_2', slot: 'hands', minLevel: 3, name: '人體工學自動鏟土臂', price: 3800, desc: '採收效率 +12%' },

      { id: 'f_1', slot: 'feet', minLevel: 1, name: '防滑防水耐酸雨靴', price: 500, desc: '穩定度提升' },
      { id: 'f_2', slot: 'feet', minLevel: 4, name: '氣墊減震工程巡視靴', price: 4200, desc: '獲得額外 ESG 經驗 +10%' }
    ];

    // RANDOM INFLOW EVENTS
    const HIGH_NITROGEN_SOURCES = [
      { name: '學校與社區高氮廚餘', weight: 45, tempImpact: 1.5, moisture: 12, phImpact: -0.3, cnImpact: -3.5 },
      { name: '果菜批發集散市場殘渣', weight: 65, tempImpact: 1.0, moisture: 15, phImpact: -0.4, cnImpact: -4.0 },
      { name: '觀光啤酒廠廢麥芽渣', weight: 55, tempImpact: 2.2, moisture: 9, phImpact: -0.2, cnImpact: -2.5 },
      { name: '畜牧養殖濃縮糞渣', weight: 80, tempImpact: 2.5, moisture: 18, phImpact: 0.2, cnImpact: -5.0 }
    ];

    /* =========================================================================
       2. GAME STATE
       ========================================================================= */
    let activeTab = 'compost';
    let isPaused = false;

    let gameState = {
      level: 1,
      exp: 0,
      nextLevelExp: 100,
      skillPoints: 0,
      coins: 5000,
      vermicompostKg: 0.0,
      carbonSeqTon: 0.0,

      ap: 3,
      maxAp: 3,

      compost: {
        temp: 24.0,           // °C (Optimal 20-28)
        moisture: 65.0,       // % (Optimal 60-70)
        ph: 7.0,              // pH (Optimal 6.5-7.5)
        cnRatio: 27.0,        // C/N (Optimal 25-30:1)
        oxygen: 20.0,         // % (Optimal >15%)
        wormKg: 1.5,          // Earthworm total biomass in kg (1kg ≈ 1,000 worms)
        areaM2: 0.5,          // Base 0.5 m²
        unprocessedWasteKg: 20,
        odorPpm: 0.0          // Odor PPM
      },

      cardPool: JSON.parse(JSON.stringify(MASTER_CARDS)),
      cardInventory: {
        'c_community_leaves': 8,
        'c_sawdust': 5,
        'c_aerate': 6,
        'c_harvest': 4,
        'c_biochar': 0,
        'c_lime': 0,
        'c_em_spray': 0,
        'c_worm_boost': 0,
        'c_auto_harvest': 0
      },
      activeDeckIds: ['c_community_leaves', 'c_sawdust', 'c_aerate'],

      skillTree: JSON.parse(JSON.stringify(SKILL_TREE_NODES)),
      techTree: JSON.parse(JSON.stringify(TECH_TREE_NODES)),

      equipment: { head: null, body: null, hands: null, feet: null },
      gameTicks: 0
    };

    /* =========================================================================
       3. HELPER & CALCULATIONS
       ========================================================================= */

    function getDeckCapacity() {
      return 2 + gameState.level;
    }

    function getSkillLevel(id) {
      const sk = gameState.skillTree.find(s => s.id === id);
      return sk ? sk.level : 0;
    }

    function getBargainDiscount() {
      return 1.0 - (getSkillLevel('sk_bargain') * 0.05);
    }

    function getMaxWormDensityKgPerM2() {
      // Base 3.0 kg/m² + 0.6 kg/m² per skill level
      return 3.0 + (getSkillLevel('sk_density') * 0.6);
    }

    function getMaxWormCapacityKg() {
      let cap = gameState.compost.areaM2 * getMaxWormDensityKgPerM2();
      if (gameState.techTree.find(t => t.id === 'tech_incubator')?.unlocked) cap *= 1.2;
      return cap;
    }

    function getPlayerBonus() {
      let apBonus = Math.floor(getSkillLevel('sk_agile_ap') / 2);
      let bodyItem = gameState.equipment.body;
      if (bodyItem && bodyItem.id === 'b_2') apBonus += 1;

      return {
        maxAp: 3 + apBonus,
        cnControlBonus: 1.0 + (getSkillLevel('sk_cn_control') * 0.20),
        carbonAuditBonus: 1.0 + (getSkillLevel('sk_carbon_audit') * 0.10),
        carbonPriceBonus: 1.0 + (getSkillLevel('sk_carbon_audit') * 0.05),
        odorDamageRed: 1.0 - (getSkillLevel('sk_odor_mitigate') * 0.15),
        climateGuard: 1.0 - (getSkillLevel('sk_climate_guard') * 0.20),
        breedBonus: 1.0 + (getSkillLevel('sk_breed_master') * 0.15),
        esgBonus: 1.0 + (getSkillLevel('sk_esg_prestige') * 0.20)
      };
    }

    function recalculateStats() {
      const bonus = getPlayerBonus();
      gameState.maxAp = bonus.maxAp;
      if (gameState.ap > gameState.maxAp) gameState.ap = gameState.maxAp;
      updateHUD();
    }

    function showToast(msg, icon = 'fa-circle-info') {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = msg;
      document.getElementById('toast-icon').className = `fa-solid ${icon} text-emerald-400`;
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2500);
    }

    function updateHUD() {
      const cap = getDeckCapacity();
      document.getElementById('hud-coins').innerText = `NT$ ${Math.floor(gameState.coins).toLocaleString()}`;
      document.getElementById('hud-vermicompost').innerText = `${gameState.vermicompostKg.toFixed(1)} Kg`;
      document.getElementById('hud-carbon-seq').innerText = `${gameState.carbonSeqTon.toFixed(3)} t`;
      document.getElementById('hud-level').innerText = gameState.level;
      document.getElementById('hud-deck-cap').innerText = `${gameState.activeDeckIds.length}/${cap}`;

      const expPercent = Math.min(100, Math.floor((gameState.exp / gameState.nextLevelExp) * 100));
      document.getElementById('hud-exp-bar').style.width = `${expPercent}%`;

      const odorVal = Math.floor(gameState.compost.odorPpm);
      document.getElementById('hud-odor-val').innerText = `${odorVal} PPM`;
      const odorBadge = document.getElementById('hud-odor-badge');
      if (odorVal > 80) {
        odorBadge.className = 'text-[11px] bg-rose-950 border border-rose-600 text-rose-300 px-2 py-1 rounded-lg flex items-center gap-1 pulse-danger';
      } else {
        odorBadge.className = 'text-[11px] bg-slate-800 border border-slate-700 text-slate-300 px-2 py-1 rounded-lg flex items-center gap-1';
      }

      const badge = document.getElementById('badge-skill-pts');
      if (gameState.skillPoints > 0) {
        badge.innerText = gameState.skillPoints;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function addESGExp(amount) {
      const bonus = getPlayerBonus();
      const actualExp = Math.floor(amount * bonus.esgBonus);
      gameState.exp += actualExp;

      if (gameState.exp >= gameState.nextLevelExp) {
        gameState.exp -= gameState.nextLevelExp;
        gameState.level += 1;
        gameState.skillPoints += 5; // 5 skill points per level
        gameState.nextLevelExp = Math.floor(gameState.nextLevelExp * 1.5);
        recalculateStats();
        showToast(`等級提升至 Lv.${gameState.level}！獲得 5 點天賦點數！`, 'fa-angles-up');
      }
      updateHUD();
    }

    /* =========================================================================
       4. SIMULATION ENGINE & PHYSICS KINETICS
       ========================================================================= */

    function tickSimulation() {
      if (isPaused) return;

      gameState.gameTicks += 1;
      const c = gameState.compost;
      const bonus = getPlayerBonus();

      // Real World Health Factors (0.0 ~ 1.0)
      let tempHealth = (c.temp >= 20 && c.temp <= 28) ? 1.0 : (c.temp < 12 || c.temp > 35) ? 0.1 : 0.6;
      let moistHealth = (c.moisture >= 60 && c.moisture <= 70) ? 1.0 : (c.moisture < 40 || c.moisture > 85) ? 0.2 : 0.6;
      let phHealth = (c.ph >= 6.5 && c.ph <= 7.5) ? 1.0 : 0.4;
      let cnHealth = (c.cnRatio >= 25 && c.cnRatio <= 35) ? 1.0 : (c.cnRatio < 18) ? 0.3 : 0.7;

      let overallHealth = (tempHealth + moistHealth + phHealth + cnHealth) / 4.0;

      // 1) REAL CONSUMPTION RATE
      // 1 kg earthworm consumes 0.5 kg ~ 0.8 kg waste daily (approx 0.03~0.05 kg per tick)
      let dailyRate = 0.6 * overallHealth; 
      let tickConsumptionCapacity = (c.wormKg * dailyRate) * 0.1; // per simulation tick

      if (c.unprocessedWasteKg > 0) {
        let processed = Math.min(c.unprocessedWasteKg, tickConsumptionCapacity);
        c.unprocessedWasteKg -= processed;
        gameState.vermicompostKg += processed; // 1:1 conversion to raw vermicompost
        addESGExp(Math.floor(processed * 3));
      }

      // 2) ODOR PPM KINETICS (CRITICAL REQUIREMENT)
      // When C/N >= 30:1 (or 25-35:1 zone), odor DOES NOT INCREASE; it natural DECAYS slowly.
      if (c.cnRatio >= 28.0) {
        let decayRate = 3.0 + (c.cnRatio - 28.0) * 0.2; // Natural decay rate
        if (gameState.techTree.find(t => t.id === 'tech_biochar')?.unlocked) decayRate += 2.0;
        c.odorPpm = Math.max(0.0, c.odorPpm - decayRate);
      } else {
        // C/N < 25: Low C/N, high nitrogen anaerobic fermentation causes odor spike
        let odorSpike = (28.0 - c.cnRatio) * 1.8 * (c.unprocessedWasteKg > 15 ? 1.5 : 1.0);
        c.odorPpm = Math.min(300.0, c.odorPpm + odorSpike);
      }

      // 3) EARTHWORM POPULATION DYNAMICS (Breeding, Escape, Death)
      const maxCapKg = getMaxWormCapacityKg();

      // Breeding: In optimal conditions
      if (overallHealth > 0.75 && c.wormKg < maxCapKg) {
        let breedRate = 0.008 * bonus.breedBonus;
        c.wormKg = Math.min(maxCapKg, c.wormKg + (c.wormKg * breedRate));
      }

      // Escape & Death Triggers
      let lossRate = 0.0;
      // High odor / Anaerobic penalty
      if (c.odorPpm > 100) lossRate += 0.03 * bonus.odorDamageRed;
      // Extreme moisture penalty
      if (c.moisture > 85 || c.moisture < 40) lossRate += 0.04;
      // Extreme temp penalty
      if (c.temp > 32 || c.temp < 15) lossRate += 0.05 * bonus.climateGuard;
      // Density overload penalty
      if (c.wormKg > maxCapKg) lossRate += 0.05;

      if (lossRate > 0) {
        let lossKg = c.wormKg * lossRate;
        c.wormKg = Math.max(0.1, c.wormKg - lossKg);
      }

      // Environmental Drift Dynamics
      c.moisture = Math.max(20.0, c.moisture - 0.15);
      c.oxygen = Math.max(5.0, c.oxygen - 0.2);

      // Random Waste Inflow Event (Every 12 ticks)
      if (gameState.gameTicks % 12 === 0) {
        triggerHighNitrogenInflow();
      }

      // Auto misting system check
      if (c.moisture < 50.0 && gameState.techTree.find(t => t.id === 'tech_misting')?.unlocked) {
        c.moisture = Math.min(68.0, c.moisture + 15.0);
      }

      updateHUD();

      // In-place DOM update
      if (activeTab === 'compost') {
        updateCompostDOMInPlace();
      }
    }

    function triggerHighNitrogenInflow() {
      const src = HIGH_NITROGEN_SOURCES[Math.floor(Math.random() * HIGH_NITROGEN_SOURCES.length)];
      const c = gameState.compost;
      
      let incomingWeight = src.weight;
      if (gameState.techTree.find(t => t.id === 'tech_pre_ferment')?.unlocked) {
        incomingWeight *= 0.8;
      }

      c.unprocessedWasteKg += incomingWeight;
      c.moisture = Math.min(95, c.moisture + src.moisture);
      c.ph = Math.max(4.0, Math.min(9.0, c.ph + src.phImpact));
      c.temp = Math.min(40, c.temp + src.tempImpact);
      c.cnRatio = Math.max(10.0, c.cnRatio + src.cnImpact);

      showToast(`注意：收到【${src.name}】高氮廢棄物 ${Math.floor(incomingWeight)} Kg！C/N 比下降！`, 'fa-truck-ramp-box');
    }

    function toggleGamePause() {
      isPaused = !isPaused;
      document.getElementById('pause-text').innerText = isPaused ? '已暫停' : '運行中';
      document.getElementById('pause-icon').className = isPaused ? 'fa-solid fa-play' : 'fa-solid fa-pause';
      showToast(isPaused ? '遊戲已暫停' : '遊戲繼續進行', isPaused ? 'fa-pause' : 'fa-play');
    }

    // In-place DOM update during simulation tick to avoid jump/re-render
    function updateCompostDOMInPlace() {
      const c = gameState.compost;
      
      const setTxt = (id, txt) => {
        const el = document.getElementById(id);
        if (el) el.innerText = txt;
      };

      setTxt('val-temp', `${c.temp.toFixed(1)}°C`);
      setTxt('val-moist', `${c.moisture.toFixed(1)}%`);
      setTxt('val-ph', `${c.ph.toFixed(2)}`);
      setTxt('val-cn', `${c.cnRatio.toFixed(1)}:1`);
      setTxt('val-oxy', `${c.oxygen.toFixed(1)}%`);
      setTxt('val-odor', `${Math.floor(c.odorPpm)} PPM`);

      setTxt('val-worm-kg', c.wormKg.toFixed(2));
      setTxt('val-max-worm-kg', getMaxWormCapacityKg().toFixed(2));
      setTxt('val-worm-count', Math.floor(c.wormKg * 1000).toLocaleString());

      const barWorm = document.getElementById('bar-worm-pop');
      if (barWorm) barWorm.style.width = `${Math.min(100, (c.wormKg / getMaxWormCapacityKg()) * 100)}%`;

      setTxt('val-waste-kg', `${Math.floor(c.unprocessedWasteKg)} Kg`);
      setTxt('val-ap', gameState.ap);
      setTxt('val-max-ap', gameState.maxAp);
    }

    /* =========================================================================
       7. CARD ACTIONS
       ========================================================================= */

    function useCard(cardId) {
      const card = gameState.cardPool.find(c => c.id === cardId);
      const count = gameState.cardInventory[cardId] || 0;

      if (!card || count <= 0) {
        showToast('該資材卡牌庫存不足！請至卡牌商店用 NT$ 補充！', 'fa-triangle-exclamation');
        return;
      }

      if (gameState.ap < card.cost) {
        showToast('行動點數 (AP) 不足！請點擊回合休養。', 'fa-bolt');
        return;
      }

      gameState.ap -= card.cost;
      gameState.cardInventory[cardId] -= 1;

      const c = gameState.compost;
      const bonus = getPlayerBonus();

      if (card.id === 'c_community_leaves') {
        c.cnRatio += 4.5 * bonus.cnControlBonus;
        c.moisture = Math.max(20, c.moisture - 3.0 * bonus.cnControlBonus);
        addESGExp(15 + getSkillLevel('sk_community') * 10);
      } else if (card.id === 'c_sawdust') {
        c.cnRatio += 8.0 * bonus.cnControlBonus;
        c.moisture = Math.max(20, c.moisture - 5.0 * bonus.cnControlBonus);
        c.odorPpm = Math.max(0, c.odorPpm - 15);
      } else if (card.id === 'c_aerate') {
        c.oxygen = Math.min(100, c.oxygen + 25);
        c.temp = Math.max(15, c.temp - 2.0);
      } else if (card.id === 'c_harvest') {
        gameState.vermicompostKg += 30;
        addESGExp(35);
      } else if (card.id === 'c_biochar') {
        c.cnRatio += 15.0 * bonus.cnControlBonus;
        c.moisture = Math.max(20, c.moisture - 8.0 * bonus.cnControlBonus);
        c.odorPpm = Math.max(0, c.odorPpm - 40);
      } else if (card.id === 'c_lime') {
        c.ph = Math.min(9.0, c.ph + 0.8);
      } else if (card.id === 'c_em_spray') {
        c.odorPpm = Math.max(0, c.odorPpm - 30);
      } else if (card.id === 'c_worm_boost') {
        c.wormKg = Math.min(getMaxWormCapacityKg(), c.wormKg + 0.8);
      } else if (card.id === 'c_auto_harvest') {
        gameState.vermicompostKg += 80;
        addESGExp(90);
      }

      showToast(`發動【${card.name}】！剩餘 ${gameState.cardInventory[cardId]} 張`, 'fa-wand-magic-sparkles');
      renderMainView();
    }

    function replenishAP() {
      const bonus = getPlayerBonus();
      gameState.ap = bonus.maxAp;
      showToast('完成回合休養，AP 重置滿格！', 'fa-bolt');
      renderMainView();
    }

    /* =========================================================================
       8. VIEW 2: CARD DECK & SHOP
       ========================================================================= */

    function renderDeckView() {
      const view = document.getElementById('main-view');
      const capacity = getDeckCapacity();
      const discount = getBargainDiscount();

      view.innerHTML = `
        <div class="flex-1 flex flex-col p-5 max-w-5xl mx-auto w-full overflow-y-auto space-y-5">
          <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <div>
              <h2 class="text-lg font-black text-purple-400 flex items-center gap-2">
                <i class="fa-solid fa-cards"></i> 戰術牌組與資材補充商店
              </h2>
              <p class="text-xs text-slate-400 mt-0.5">資材卡牌使用完畢後可使用 NT$ 補充。（出戰攜帶上限：<b class="text-purple-300">${capacity}</b> 種）</p>
            </div>
            <div class="text-xs bg-slate-900 border border-purple-500/40 px-3 py-1.5 rounded-xl text-purple-300 font-bold">
              出戰狀態: ${gameState.activeDeckIds.length} / ${capacity}
            </div>
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
            ${gameState.cardPool.map(card => {
              const isActive = gameState.activeDeckIds.includes(card.id);
              const count = gameState.cardInventory[card.id] || 0;
              const cardStyle = CARD_TYPES[card.type] || CARD_TYPES.CARBON;
              const discountedPrice = Math.floor(card.basePrice * discount);

              return `
                <div class="rounded-xl bg-gradient-to-b ${cardStyle.color} border p-3 flex flex-col justify-between h-56 relative shadow-lg ${!card.unlocked ? 'opacity-40 grayscale' : ''}">
                  <div class="flex justify-between items-center text-[10px] uppercase font-bold">
                    <span>${cardStyle.name}</span>
                    <span class="w-5 h-5 rounded-full bg-amber-500 text-slate-950 font-black flex items-center justify-center text-xs">${card.cost} AP</span>
                  </div>
                  <div class="text-center my-auto">
                    <h4 class="font-bold text-xs text-slate-100">${card.name}</h4>
                    <p class="text-[9px] text-slate-300 mt-1 leading-tight">${card.desc}</p>
                    <div class="mt-2 text-xs font-black text-amber-300">
                      庫存: ${count} 張
                    </div>
                  </div>

                  ${card.unlocked ? `
                    <div class="space-y-1">
                      <button onclick="buyCardConsumable('${card.id}')" class="w-full py-1 text-[10px] font-black bg-amber-500 hover:bg-amber-400 text-slate-950 rounded transition">
                        補充 1 張 (NT$ ${discountedPrice})
                      </button>
                      <button onclick="toggleDeckActive('${card.id}')" class="w-full py-1 text-[10px] font-bold rounded transition ${isActive ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">
                        ${isActive ? '已出戰' : '選入出戰'}
                      </button>
                    </div>
                  ` : `
                    <div class="text-[10px] text-rose-400 font-bold text-center bg-slate-950/60 py-1 rounded">
                      須在科技樹研發解鎖
                    </div>
                  `}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function buyCardConsumable(cardId) {
      const card = gameState.cardPool.find(c => c.id === cardId);
      if (!card) return;

      const price = Math.floor(card.basePrice * getBargainDiscount());
      if (gameState.coins < price) {
        showToast('資金 (NT$) 不足，無法補充卡牌！', 'fa-triangle-exclamation');
        return;
      }

      gameState.coins -= price;
      gameState.cardInventory[cardId] = (gameState.cardInventory[cardId] || 0) + 1;
      showToast(`成功補充 1 張【${card.name}】！`, 'fa-cart-shopping');
      renderDeckView();
      updateHUD();
    }

    function toggleDeckActive(cardId) {
      const idx = gameState.activeDeckIds.indexOf(cardId);
      const cap = getDeckCapacity();

      if (idx > -1) {
        if (gameState.activeDeckIds.length <= 1) {
          showToast('出戰牌組至少需保留 1 種卡牌！', 'fa-triangle-exclamation');
          return;
        }
        gameState.activeDeckIds.splice(idx, 1);
      } else {
        if (gameState.activeDeckIds.length >= cap) {
          showToast(`已達當前攜帶上限 (${cap} 種)！提升等級可擴充攜帶數。`, 'fa-triangle-exclamation');
          return;
        }
        gameState.activeDeckIds.push(cardId);
      }
      renderDeckView();
      updateHUD();
    }

    /* =========================================================================
       9. VIEW 3: SKILL TREE (10 SKILLS, MAX LEVEL 5 EACH)
       ========================================================================= */

    function renderSkillsView() {
      const view = document.getElementById('main-view');

      view.innerHTML = `
        <div class="flex-1 flex flex-col p-5 max-w-4xl mx-auto w-full overflow-y-auto space-y-4">
          <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <div>
              <h2 class="text-lg font-black text-cyan-400 flex items-center gap-2">
                <i class="fa-solid fa-user-ninja"></i> 天賦技能樹 (完整 10 種技能)
              </h2>
              <p class="text-xs text-slate-400 mt-0.5">每提升 1 級獲得 <b>5 點天賦點數</b>，每項天賦上限為 5 級。</p>
            </div>
            <div class="text-xs bg-slate-900 border border-cyan-500/40 px-3 py-1 rounded-xl text-cyan-300 font-bold">
              剩餘技能點數: ${gameState.skillPoints}
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            ${gameState.skillTree.map(sk => `
              <div class="bg-slate-900 border border-slate-800 rounded-xl p-3.5 flex flex-col justify-between shadow-lg">
                <div>
                  <div class="flex items-center justify-between">
                    <h4 class="font-bold text-xs text-cyan-300">${sk.name}</h4>
                    <span class="text-[10px] text-cyan-400 font-bold bg-slate-950 px-2 py-0.5 rounded">Lv.${sk.level} / ${sk.maxLevel}</span>
                  </div>
                  <p class="text-[11px] text-slate-400 mt-1 leading-relaxed">${sk.desc}</p>
                </div>
                <div class="mt-3 text-right">
                  <button onclick="upgradeSkill('${sk.id}')" ${gameState.skillPoints < sk.cost || sk.level >= sk.maxLevel ? 'disabled' : ''}
                    class="px-3 py-1 rounded-xl font-bold text-xs uppercase transition ${sk.level >= sk.maxLevel ? 'bg-slate-800 text-slate-500' : 'bg-cyan-600 hover:bg-cyan-500 text-slate-950 disabled:opacity-40'}">
                    ${sk.level >= sk.maxLevel ? '已滿級' : `升級 (${sk.cost} 點)`}
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function upgradeSkill(skillId) {
      const sk = gameState.skillTree.find(s => s.id === skillId);
      if (!sk || gameState.skillPoints < sk.cost || sk.level >= sk.maxLevel) return;

      gameState.skillPoints -= sk.cost;
      sk.level += 1;
      recalculateStats();
      showToast(`升級成功：${sk.name} (Lv.${sk.level})！`, 'fa-circle-check');
      renderSkillsView();
    }

    /* =========================================================================
       10. VIEW 4: TECH TREE (20 TECHS IN 4 DOMAINS)
       ========================================================================= */

    function renderTechView() {
      const view = document.getElementById('main-view');
      const domains = ['基礎設施', '微生物與資材', '感測器與自動化', '高階碳資產'];

      view.innerHTML = `
        <div class="flex-1 flex flex-col p-5 max-w-5xl mx-auto w-full overflow-y-auto space-y-4">
          <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <div>
              <h2 class="text-lg font-black text-emerald-400 flex items-center gap-2">
                <i class="fa-solid fa-diagram-project"></i> 永續科技樹研發系統 (四大領域共 20 項)
              </h2>
              <p class="text-xs text-slate-400 mt-0.5">花費資金 (NT$) 研發科技，解鎖特殊資材卡牌與高級碳權交易。</p>
            </div>
            <div class="text-xs bg-slate-900 border border-emerald-500/40 px-3 py-1 rounded-xl text-emerald-300 font-bold">
              資金: NT$ ${Math.floor(gameState.coins).toLocaleString()}
            </div>
          </div>

          <div class="space-y-5">
            ${domains.map(dom => {
              const nodes = gameState.techTree.filter(t => t.domain === dom);
              return `
                <div class="space-y-2">
                  <h3 class="text-xs font-black text-emerald-400 uppercase tracking-wider flex items-center gap-1.5">
                    <i class="fa-solid fa-layer-group"></i> ${dom}
                  </h3>
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    ${nodes.map(t => {
                      const reqMet = !t.req || gameState.techTree.find(x => x.id === t.req && x.unlocked);
                      return `
                        <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 flex items-center justify-between shadow-md">
                          <div>
                            <h4 class="font-bold text-xs text-slate-200">${t.name}</h4>
                            <p class="text-[10px] text-slate-400 mt-0.5">${t.desc}</p>
                          </div>
                          <button onclick="unlockTech('${t.id}')" ${t.unlocked || gameState.coins < t.cost || !reqMet ? 'disabled' : ''}
                            class="px-3 py-1.5 rounded-xl font-bold text-[10px] uppercase transition shrink-0 ml-2 ${t.unlocked ? 'bg-emerald-950 text-emerald-400 border border-emerald-500/50' : 'bg-emerald-500 hover:bg-emerald-400 text-slate-950 disabled:opacity-40'}">
                            ${t.unlocked ? '已研發' : `研發 NT$ ${t.cost.toLocaleString()}`}
                          </button>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function unlockTech(techId) {
      const t = gameState.techTree.find(x => x.id === techId);
      if (!t || gameState.coins < t.cost) return;

      gameState.coins -= t.cost;
      t.unlocked = true;
      if (t.apply) t.apply();

      gameState.cardPool.forEach(card => {
        if (card.techReq === techId) card.unlocked = true;
      });

      showToast(`研發成功：${t.name}！`, 'fa-microchip');
      renderTechView();
      updateHUD();
    }

    /* =========================================================================
       11. VIEW 5: EQUIPMENT SHOP (4 SLOTS)
       ========================================================================= */

    function renderShopView() {
      const view = document.getElementById('main-view');
      const discount = getBargainDiscount();

      view.innerHTML = `
        <div class="flex-1 flex flex-col p-5 max-w-5xl mx-auto w-full overflow-y-auto space-y-4">
          <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <div>
              <h2 class="text-lg font-black text-amber-400 flex items-center gap-2">
                <i class="fa-solid fa-shirt"></i> 專業裝備穿戴 (4 部位)
              </h2>
              <p class="text-xs text-slate-400 mt-0.5">【頭部】、【身體】、【手部】、【腳部】四部位裝備。</p>
            </div>
            <div class="text-xs bg-slate-900 border border-amber-500/40 px-3 py-1 rounded-xl text-amber-300 font-bold">
              資金: NT$ ${Math.floor(gameState.coins).toLocaleString()}
            </div>
          </div>

          <!-- Current Gear Slots -->
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-3">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">當前穿戴裝備</h3>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
              ${['head', 'body', 'hands', 'feet'].map(slot => {
                const item = gameState.equipment[slot];
                const slotName = { head: '頭部', body: '身體', hands: '手部', feet: '腳部' }[slot];
                return `
                  <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800 flex flex-col justify-between">
                    <span class="text-[9px] uppercase font-bold text-slate-500">${slotName}</span>
                    <span class="font-bold ${item ? 'text-emerald-400' : 'text-slate-600'} mt-1 truncate">${item ? item.name : '未裝備'}</span>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <h3 class="text-xs font-bold text-amber-400 uppercase tracking-wider">可購買裝備</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            ${BASE_EQUIPMENT.map(item => {
              const isEquipped = gameState.equipment[item.slot]?.name === item.name;
              const levelMet = gameState.level >= item.minLevel;
              const price = Math.floor(item.price * discount);
              const canAfford = gameState.coins >= price;

              return `
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 flex items-center justify-between">
                  <div>
                    <div class="flex items-center gap-2">
                      <h4 class="font-bold text-xs text-slate-100">${item.name}</h4>
                      <span class="text-[9px] px-1.5 py-0.5 rounded bg-slate-800 text-amber-400 font-bold">Lv.${item.minLevel}</span>
                    </div>
                    <p class="text-[11px] text-emerald-400 font-bold mt-0.5">${item.desc}</p>
                    <div class="text-xs text-amber-400 font-bold mt-1">NT$ ${price.toLocaleString()}</div>
                  </div>
                  <button onclick="buyAndEquipGear('${item.id}')" ${isEquipped || !levelMet || !canAfford ? 'disabled' : ''}
                    class="px-3 py-1.5 rounded-xl font-bold text-xs uppercase transition ${isEquipped ? 'bg-emerald-950 text-emerald-400 border border-emerald-500/50' : 'bg-amber-500 hover:bg-amber-400 text-slate-950 disabled:opacity-40'}">
                    ${isEquipped ? '裝備中' : '購買穿戴'}
                  </button>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function buyAndEquipGear(gearId) {
      const item = BASE_EQUIPMENT.find(g => g.id === gearId);
      if (!item) return;

      const price = Math.floor(item.price * getBargainDiscount());
      if (gameState.coins < price || gameState.level < item.minLevel) return;

      gameState.coins -= price;
      gameState.equipment[item.slot] = item;
      recalculateStats();
      showToast(`成功購買並穿戴：${item.name}！`, 'fa-shield-halved');
      renderShopView();
    }

    /* =========================================================================
       12. VIEW 6: CARBON CREDIT MARKET & NT$ ECONOMY
       ========================================================================= */

    function renderCarbonView() {
      const view = document.getElementById('main-view');
      const bonus = getPlayerBonus();

      const isIsoUnlocked = gameState.techTree.find(t => t.id === 'tech_iso14064')?.unlocked;
      const isVcsUnlocked = gameState.techTree.find(t => t.id === 'tech_vcs_standard')?.unlocked;
      const isZeroFarmUnlocked = gameState.techTree.find(t => t.id === 'tech_zero_farm')?.unlocked;

      // Base carbon credit price (NT$ 1,200/tCO2e baseline)
      let baseCarbonPrice = 1200;
      if (isIsoUnlocked) baseCarbonPrice *= 1.25;
      if (isVcsUnlocked) baseCarbonPrice *= 1.35;
      if (isZeroFarmUnlocked) baseCarbonPrice *= 2.0;

      const actualCarbonPrice = Math.floor(baseCarbonPrice * bonus.carbonPriceBonus);

      // Raw fertilizer direct sale price: NT$ 20 / kg
      const vermicompostPricePerKg = 20;

      view.innerHTML = `
        <div class="flex-1 flex flex-col p-5 max-w-5xl mx-auto w-full overflow-y-auto space-y-5">
          <div class="flex items-center justify-between border-b border-slate-800 pb-3">
            <div>
              <h2 class="text-lg font-black text-emerald-400 flex items-center gap-2">
                <i class="fa-solid fa-chart-line"></i> 碳權交易所與 ESG 專案
              </h2>
              <p class="text-xs text-slate-400 mt-0.5">對齊台灣與國際碳權行情 (基準 NT$ 1,200 / tCO2e)。1 kg 蚓糞封存約可抵換 0.00183 tCO2e。</p>
            </div>
            <div class="text-xs bg-slate-900 border border-emerald-500/40 px-3 py-1 rounded-xl text-emerald-300 font-bold">
              蚓糞庫存: ${gameState.vermicompostKg.toFixed(1)} Kg
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
            
            <!-- Soil Carbon Sequestration -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col justify-between space-y-3 shadow-xl">
              <div>
                <h3 class="font-bold text-xs text-slate-100 flex items-center gap-1.5">
                  <i class="fa-solid fa-seedling text-emerald-400"></i> 1. 蚓糞封存轉化土壤碳匯
                </h3>
                <p class="text-[11px] text-slate-400 mt-1">每 50 Kg 蚓糞封存入土壤可轉換為土壤碳匯。</p>
              </div>

              <div class="bg-slate-950 p-3 rounded-lg border border-slate-800 text-center">
                <div class="text-xl font-black text-emerald-400">${gameState.carbonSeqTon.toFixed(3)} <span class="text-xs text-slate-400">tCO2e</span></div>
                <div class="text-[9px] text-slate-500 mt-0.5">目前累積碳匯總額</div>
              </div>

              <button onclick="convertVermicompostToCarbon()" ${gameState.vermicompostKg < 50 ? 'disabled' : ''}
                class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-black rounded-xl text-xs uppercase transition disabled:opacity-40">
                封存 50 Kg 蚓糞轉化為 0.0915 tCO2e 碳匯
              </button>
            </div>

            <!-- Carbon Credit Trading -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col justify-between space-y-3 shadow-xl">
              <div>
                <h3 class="font-bold text-xs text-slate-100 flex items-center gap-1.5">
                  <i class="fa-solid fa-handshake text-amber-400"></i> 2. 碳權銷售與蚓糞零售
                </h3>
                <p class="text-[11px] text-slate-400 mt-1">將認證碳權出售給企業獲得高額資金。</p>
              </div>

              <div class="space-y-2">
                <button onclick="sellCarbonCredits()" ${gameState.carbonSeqTon < 0.1 ? 'disabled' : ''}
                  class="w-full py-3 bg-gradient-to-r from-amber-500 to-yellow-400 hover:from-amber-400 hover:to-yellow-300 text-slate-950 font-black rounded-xl text-xs uppercase transition shadow-lg disabled:opacity-40 flex flex-col items-center justify-center">
                  <span>出售 0.10 t 認證碳權</span>
                  <span class="text-[10px] font-bold text-slate-900">獲得 +NT$ ${Math.floor(actualCarbonPrice * 0.10).toLocaleString()} (單價: NT$ ${actualCarbonPrice}/t)</span>
                </button>

                <button onclick="sellFertilizerDirect()" ${gameState.vermicompostKg < 20 ? 'disabled' : ''}
                  class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-amber-300 font-bold rounded-xl text-[11px] transition border border-slate-700 disabled:opacity-40">
                  賤賣 20 Kg 原始蚓糞 (獲 +NT$ ${(20 * vermicompostPricePerKg).toLocaleString()})
                </button>
              </div>
            </div>

          </div>
        </div>
      `;
    }

    function convertVermicompostToCarbon() {
      if (gameState.vermicompostKg < 50) return;
      const bonus = getPlayerBonus();
      const amountTon = 0.0915 * bonus.carbonAuditBonus;

      gameState.vermicompostKg -= 50;
      gameState.carbonSeqTon += amountTon;
      addESGExp(50);
      showToast(`成功封存 50 Kg 蚓糞為 ${amountTon.toFixed(4)} tCO2e 土壤碳匯！`, 'fa-seedling');
      renderCarbonView();
    }

    function sellCarbonCredits() {
      if (gameState.carbonSeqTon < 0.1) return;
      const bonus = getPlayerBonus();

      let baseCarbonPrice = 1200;
      if (gameState.techTree.find(t => t.id === 'tech_iso14064')?.unlocked) baseCarbonPrice *= 1.25;
      if (gameState.techTree.find(t => t.id === 'tech_vcs_standard')?.unlocked) baseCarbonPrice *= 1.35;
      if (gameState.techTree.find(t => t.id === 'tech_zero_farm')?.unlocked) baseCarbonPrice *= 2.0;

      const actualCarbonPrice = Math.floor(baseCarbonPrice * bonus.carbonPriceBonus);
      const earnedCoins = Math.floor(actualCarbonPrice * 0.10);

      gameState.carbonSeqTon -= 0.1;
      gameState.coins += earnedCoins;
      addESGExp(120);

      showToast(`成功出售 0.1t 碳權！獲得 +NT$ ${earnedCoins.toLocaleString()}`, 'fa-sack-dollar');
      renderCarbonView();
      updateHUD();
    }

    function sellFertilizerDirect() {
      if (gameState.vermicompostKg < 20) return;
      const earnedCoins = 20 * 20; // NT$ 20/kg

      gameState.vermicompostKg -= 20;
      gameState.coins += earnedCoins;
      addESGExp(15);

      showToast(`零售 20 Kg 蚓糞，獲得 +NT$ ${earnedCoins.toLocaleString()}`, 'fa-sack-dollar');
      renderCarbonView();
      updateHUD();
    }

    /* =========================================================================
       13. INITIALIZATION
       ========================================================================= */

    window.onload = function() {
      setInterval(tickSimulation, 1500);
      switchTab('compost');
    };
  </script>
</body>
</html>
